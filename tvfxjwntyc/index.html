<style id="app-css">
/* ── tokens ───────────────────────────────────────────────────────────────
   Light is the complete palette on bare :root. Dark redefines ONLY tokens, once
   for the un-stamped system-preference case and once for the explicit stamp, so
   all three viewer states resolve. Nothing below the token blocks names a colour
   literal. Neutrals carry a warm stone bias toward the gym-tape severity family;
   the accent is a cool slate-teal so brand colour and severity colour can never
   be confused for one another. */
:root {
  --ground:#F5F3EE; --surface:#FFFFFF; --sunken:#EFECE4;
  --line:#E3DED3; --line-strong:#CFC7B8;
  --ink:#1B1916; --ink-2:#4A443C; --muted:#6B6459;
  --accent:#1F6473; --accent-soft:#DCEAEE; --accent-ink:#134D5A;
  --crit:#9E2B1B; --crit-soft:#F6E2DE;
  --warn:#A8830C; --warn-soft:#F7EDD5;
  --good:#2F7248; --good-soft:#DFEDE3;
  --shadow:0 1px 2px rgba(27,25,22,.05), 0 8px 24px -18px rgba(27,25,22,.35);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:#131210; --surface:#1D1B17; --sunken:#252119;
    --line:#332F28; --line-strong:#4A443A;
    --ink:#EFECE4; --ink-2:#C9C2B5; --muted:#9C9486;
    --accent:#5AACC0; --accent-soft:#1B3940; --accent-ink:#8FCBDA;
    --crit:#E2564B; --crit-soft:#3A211D;
    --warn:#C99F28; --warn-soft:#33290F;
    --good:#3F9459; --good-soft:#182C1F;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  --ground:#131210; --surface:#1D1B17; --sunken:#252119;
  --line:#332F28; --line-strong:#4A443A;
  --ink:#EFECE4; --ink-2:#C9C2B5; --muted:#9C9486;
  --accent:#5AACC0; --accent-soft:#1B3940; --accent-ink:#8FCBDA;
  --crit:#E2564B; --crit-soft:#3A211D;
  --warn:#C99F28; --warn-soft:#33290F;
  --good:#3F9459; --good-soft:#182C1F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -18px rgba(0,0,0,.8);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3 { font-family:"Archivo", ui-sans-serif, system-ui, sans-serif; text-wrap:balance; margin:0; }
a { color:var(--accent); text-decoration-thickness:1px; text-underline-offset:2px; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:2px; }
code, .mono, td.num, th.num { font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }
.num { font-variant-numeric: tabular-nums; text-align:right; }
.wrap { max-width:1180px; margin:0 auto; padding:0 20px; }

/* ── header ── */
header {
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.masthead { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; padding:18px 0 12px; }
.mark { font-family:"Archivo"; font-weight:700; font-size:19px; letter-spacing:-.02em; }
.mark span { color:var(--accent); }
.stamp { color:var(--muted); font-size:12.5px; margin-left:auto; font-variant-numeric:tabular-nums; }
.strip { display:flex; gap:26px; flex-wrap:wrap; padding-bottom:14px; }
.stat { display:flex; flex-direction:column; gap:1px; }
.stat b { font-family:"Archivo"; font-weight:600; font-size:23px; letter-spacing:-.02em;
          font-variant-numeric:tabular-nums; line-height:1.1; }
.stat small { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); }
.stat.alarm b { color:var(--crit); }

/* ── tabs ── */
nav { display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; }
nav::-webkit-scrollbar { display:none; }
nav button {
  appearance:none; background:none; border:0; border-bottom:2px solid transparent;
  color:var(--muted); font:inherit; font-size:13.5px; font-weight:500;
  padding:9px 12px; cursor:pointer; white-space:nowrap;
}
nav button:hover { color:var(--ink); }
nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); }
nav button .n { font-family:"IBM Plex Mono"; font-size:11px; color:var(--muted);
                margin-left:5px; font-variant-numeric:tabular-nums; }

main { padding:26px 0 80px; }
section[hidden] { display:none; }
.panel {
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:20px; margin-bottom:18px; box-shadow:var(--shadow);
}
.panel > h2 { font-size:16px; font-weight:600; letter-spacing:-.01em; }
.panel > .sub { color:var(--muted); font-size:13px; margin:5px 0 16px; max-width:74ch; }
.panel > .sub:last-child { margin-bottom:0; }

/* ── the queue: the one panel that makes a recommendation ── */
.qcard {
  display:grid; grid-template-columns:auto 1fr; gap:0 16px;
  border:1px solid var(--line); border-radius:7px; padding:14px 16px 14px 0;
  margin-bottom:10px; background:var(--surface); position:relative; overflow:hidden;
}
.qcard::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--line-strong); }
.qcard.sev-1::before { background:var(--crit); }
.qcard.sev-2::before { background:var(--warn); }
.qcard.sev-3::before { background:var(--accent); }
.qrank {
  font-family:"Archivo"; font-weight:700; font-size:15px; color:var(--muted);
  padding-left:18px; padding-top:1px; font-variant-numeric:tabular-nums;
}
.qhead { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.qname { font-family:"IBM Plex Mono"; font-weight:600; font-size:14.5px; }
.qcard.kind-coverage .qname { font-family:"Archivo"; font-weight:600; font-size:15px; }
.qreason { color:var(--ink-2); font-size:13.5px; margin-top:5px; max-width:82ch; }
.qmeta { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px;
         font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); }

.chip {
  display:inline-flex; align-items:center; gap:5px; border-radius:99px;
  padding:2px 9px; font-size:11px; font-weight:600; letter-spacing:.02em;
  text-transform:uppercase; white-space:nowrap;
}
.chip.film { background:var(--crit-soft); color:var(--crit); }
.chip.label { background:var(--accent-soft); color:var(--accent-ink); }
.chip.resplit { background:var(--warn-soft); color:var(--warn); }
.chip.ok { background:var(--good-soft); color:var(--good); }
.chip.flat { background:var(--sunken); color:var(--muted); }

/* ── the span-bar motif: what a strike span looks like on a timeline, reused
      wherever a total is really a set of segments. Encodes distribution, not
      decoration — the largest segment is the one that decides split health. ── */
.bar { display:flex; gap:2px; height:8px; border-radius:2px; overflow:hidden; background:var(--sunken); }
.bar i { display:block; height:100%; background:var(--line-strong); border-radius:1px; }
.bar i.lead { background:var(--accent); }
.bar i.over { background:var(--crit); }
.meter { height:8px; border-radius:99px; background:var(--sunken); overflow:hidden; min-width:70px; }
.meter i { display:block; height:100%; background:var(--accent); border-radius:99px; }
.meter i.done { background:var(--good); }
.meter i.low { background:var(--crit); }

/* ── tables ── */
.tablewrap { overflow-x:auto; margin:0 -20px; padding:0 20px; }
table { border-collapse:collapse; width:100%; font-size:13px; }
th { text-align:left; font-weight:600; font-size:11px; text-transform:uppercase;
     letter-spacing:.07em; color:var(--muted); padding:0 10px 7px; white-space:nowrap;
     border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); }
th.sortable { cursor:pointer; user-select:none; }
th.sortable:hover { color:var(--ink); }
th[aria-sort] { color:var(--ink); }
th[aria-sort="descending"]::after { content:" ↓"; }
th[aria-sort="ascending"]::after { content:" ↑"; }
td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
tbody tr:hover { background:var(--sunken); }
td.name { font-family:"IBM Plex Mono"; font-size:12.5px; white-space:nowrap; }
td.dim { color:var(--muted); }
tr.bad td.name { color:var(--crit); }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search] {
  font:inherit; font-size:13px; padding:5px 10px; border:1px solid var(--line-strong);
  border-radius:5px; background:var(--surface); color:var(--ink); min-width:190px;
}
.toolbar label { font-size:12.5px; color:var(--muted); display:flex; gap:6px; align-items:center; }

/* ── notes & callouts ── */
.note { border-left:2px solid var(--line-strong); padding:2px 0 2px 12px; color:var(--muted);
        font-size:12.5px; margin:12px 0 0; max-width:82ch; }
.note.warn { border-left-color:var(--warn); color:var(--ink-2); }
.note.crit { border-left-color:var(--crit); color:var(--ink-2); }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
.tile { border:1px solid var(--line); border-radius:7px; padding:14px; }
.tile h3 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
           font-weight:600; margin-bottom:6px; }
.tile .big { font-family:"Archivo"; font-weight:700; font-size:30px; letter-spacing:-.02em;
             font-variant-numeric:tabular-nums; line-height:1.05; }
.tile .of { color:var(--muted); font-size:14px; font-weight:500; }
.tile p { margin:8px 0 0; font-size:12.5px; color:var(--muted); }
ul.plain { margin:10px 0 0; padding-left:18px; font-size:13px; color:var(--ink-2); }
ul.plain li { margin-bottom:4px; }
.kv { display:flex; gap:6px; font-size:12.5px; color:var(--muted); }
.kv b { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }

/* ── kanban ── */
.kan { display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
.kan .col { border:1px solid var(--line); border-radius:7px; padding:12px; background:var(--sunken); }
.kan .col h3 { font-size:11px; text-transform:uppercase; letter-spacing:.07em;
               color:var(--muted); font-weight:600; }
.kan .col .big { font-family:"Archivo"; font-weight:700; font-size:26px; margin-top:4px;
                 font-variant-numeric:tabular-nums; }
.kan .col .unk { font-size:11.5px; color:var(--warn); margin-top:2px; }

footer { color:var(--muted); font-size:12px; padding:26px 0; border-top:1px solid var(--line); }

@media (max-width:640px) {
  .wrap { padding:0 14px; }
  .panel { padding:15px; border-radius:7px; }
  .tablewrap { margin:0 -15px; padding:0 15px; }
  .strip { gap:18px; }
  .stat b { font-size:19px; }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

/* ── the work board ───────────────────────────────────────────────────────
   The board is the page's reason to exist for everyone who is not Imran: it
   answers "what am I doing today" without requiring anyone to read a metric.
   Assignments, deadlines and status are SHARED — they are stored in the page
   itself and republished when someone edits, so the board one person sees is
   the board everyone sees. */
.board-toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.seg { display:inline-flex; border:1px solid var(--line-strong); border-radius:6px; overflow:hidden; }
.seg button {
  appearance:none; border:0; background:var(--surface); color:var(--muted);
  font:inherit; font-size:12.5px; padding:5px 11px; cursor:pointer; white-space:nowrap;
}
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--accent); color:var(--surface); }

.work { display:flex; flex-direction:column; gap:8px; }
.item {
  display:grid; grid-template-columns:6px 1fr auto; gap:0;
  border:1px solid var(--line); border-radius:7px; background:var(--surface); overflow:hidden;
}
/* One colour for work, so the stripe means "this is a job" rather than shifting with rank.
   Red is reserved for the only card that deletes something. */
.item .sev { background:var(--accent); }
.item.danger .sev { background:var(--crit); }
.item.done { opacity:.55; }
.item.done .title { text-decoration:line-through; }
.item .body { padding:12px 14px; min-width:0; }
.item .title { display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.item .title b { font-family:"IBM Plex Mono"; font-weight:600; font-size:14px; }
.item .why { color:var(--ink-2); font-size:13px; margin-top:4px; max-width:80ch; }
.item .ids { margin-top:7px; display:flex; gap:6px; flex-wrap:wrap; }
.item .ids code {
  background:var(--sunken); border-radius:4px; padding:1px 6px; font-size:11.5px; color:var(--muted);
}
.item .ctl {
  display:flex; flex-direction:column; gap:6px; padding:12px 14px; border-left:1px solid var(--line);
  background:var(--sunken); min-width:190px;
}
.item .ctl label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
.item .ctl select, .item .ctl input[type=date] {
  font:inherit; font-size:12.5px; padding:4px 7px; border:1px solid var(--line-strong);
  border-radius:5px; background:var(--surface); color:var(--ink); width:100%;
}
.item .ctl .row { display:flex; gap:6px; }
.item .ctl .row > * { flex:1; min-width:0; }

.due { font-size:11.5px; font-weight:600; }
.due.over { color:var(--crit); }
.due.soon { color:var(--warn); }
.due.ok { color:var(--muted); }

.flagbtn {
  appearance:none; border:0; background:none; cursor:pointer; font-size:15px; line-height:1;
  padding:2px 4px; border-radius:4px; color:var(--line-strong);
}
.flagbtn[aria-pressed="true"] { color:var(--warn); }
.flagbtn:hover { background:var(--sunken); color:var(--warn); }

.saving {
  position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--ground); font-size:12.5px; padding:7px 14px;
  border-radius:99px; z-index:60; box-shadow:var(--shadow);
}
.readonly-banner {
  background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
  border-radius:6px; padding:9px 13px; font-size:12.5px; margin-bottom:14px;
}

/* Plain-language diagnosis cards on the model tab. */
.diag { border:1px solid var(--line); border-radius:7px; padding:14px 16px; margin-bottom:10px; }
.diag h4 { margin:0; font-family:"Archivo"; font-size:14.5px; font-weight:600; }
.diag .plain { margin-top:6px; font-size:13.5px; color:var(--ink-2); max-width:80ch; }
.diag .todo { margin-top:9px; font-size:13px; font-weight:600; }
.diag .todo.nobody { color:var(--muted); font-weight:400; }
.diag .nums { margin-top:8px; font-family:"IBM Plex Mono"; font-size:11.5px; color:var(--muted); }

.pick {
  font:inherit; font-size:13px; padding:5px 9px; border:1px solid var(--line-strong);
  border-radius:5px; background:var(--surface); color:var(--ink);
}

/* Home's single headline number — the week's goal, readable across a room. */
.hero { display:flex; gap:24px; flex-wrap:wrap; }
.hero > div { flex:1; min-width:240px; }
.herobig {
  font-family:"Archivo"; font-weight:700; font-size:44px; letter-spacing:-.03em;
  line-height:1; font-variant-numeric:tabular-nums;
}
.herobig .of { font-size:18px; font-weight:500; color:var(--muted); letter-spacing:-.01em; }
ol.plain { margin:10px 0 0; padding-left:20px; font-size:13.5px; color:var(--ink-2); }
ol.plain li { margin-bottom:9px; }

/* Status as a mark, not a word — a row's state should register before it is read. */
.dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--line-strong); }
.dot.doing   { background:var(--accent); }
.dot.blocked { background:var(--crit); }
.dot.done    { background:var(--good); }
.item .title { align-items:center; }

/* The CVAT task number, next to the clip name — it is what a labeller actually types into CVAT. */
.taskid {
  font-family:"IBM Plex Mono"; font-size:12px; font-weight:600; color:var(--accent-ink);
  background:var(--accent-soft); border-radius:4px; padding:1px 6px; flex:0 0 auto;
}

</style>

const DATA = JSON.parse(document.getElementById("app-data").textContent);
let STATE = JSON.parse(document.getElementById("app-state").textContent);
if (!STATE || typeof STATE !== "object") STATE = {};
STATE.work = STATE.work || {};
STATE.flags = STATE.flags || {};
STATE.hidden = STATE.hidden || [];

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const num = n => (n === null || n === undefined) ? "—" : n.toLocaleString();
const pct = x => x === null || x === undefined ? "—" : Math.round(100 * x) + "%";
const STATUSES = [["todo", "To do"], ["doing", "In progress"], ["blocked", "Blocked"], ["done", "Done"]];

/* ══ work items ═══════════════════════════════════════════════════════════
   Items are DERIVED from the measurements every build, and STATE only carries the human overlay
   (who, when, how far along). That way a refresh brings in new problems and retires solved ones
   without ever losing an assignment. */
function workItems() {
  /* CLIPS TO LABEL. One row per video, each with an id, an owner and a date. Filming jobs are a
     different kind of work with no video id yet, so they live on Footage — see recordingItems(). */
  const out = [];
  const add = (id, o) => out.push(Object.assign({
    id, priority: 3, ids: [], why: "", kind: "labelling", assignee: "",
  }, o, STATE.work[id] || {}));

  /* Clips sitting in CVAT waiting to be labelled. Every row already carries the CVAT assignee, so
     this is the "what am I labelling today" list — the reason most people open this page. */
  (DATA.pipeline.awaiting_label || []).forEach(t => {
    add("task:" + t.task_id, {
      title: t.name, task: t.task_id, kind: "labelling",
      priority: t.state === "in progress" ? 2 : 3,
      what: "Label",
      why: "Nothing labelled in it yet.",
      ids: t.age_days >= 1 ? [Math.round(t.age_days) + "d old"] : [],
      assignee: (STATE.work["task:" + t.task_id] || {}).assignee || t.assignee || "",
    });
  });

  /* Already labelled, still not on disk. Two sub-cases needing different words: a job the labeller
     never marked complete, versus one complete and awaiting export. Neither is "go label this" —
     telling somebody to redo finished work is how a board loses trust. */
  (DATA.pipeline.awaiting_export || []).forEach(t => {
    const done = t.state === "completed";
    add("export:" + t.task_id, {
      title: t.name, task: t.task_id, kind: "labelling", priority: 1,
      what: done ? "Export" : "Mark done",
      why: done
        ? "Finished in CVAT but no file on disk, so none of it has reached a training run."
        : t.labelled_spans + " strikes are already labelled. Check it over and set the job to "
          + "Completed in CVAT so it can be exported.",
      ids: [t.labelled_spans + " strikes labelled"]
        .concat(done ? [Math.round(t.idle_days) + "d since last touched"] : []),
      assignee: (STATE.work["export:" + t.task_id] || {}).assignee || t.assignee || "",
    });
  });

  (DATA.quality.no_pose || []).forEach(r => {
    add("pose:" + r.video_id, {
      title: r.video_id, kind: "labelling", what: "Pose", priority: 1,
      why: r.spans + " labelled strikes that training will silently skip — there is no pose file "
         + "for this clip, so the ingest drops it.",
      ids: [r.file, r.spans + " strikes"],
    });
  });

  (DATA.quality.duplicate_tasks || []).forEach(t => {
    const keep = (t.keep || [])[0];
    const empty = t.empty || [];
    add("dup:" + t.name, {
      title: t.name, task: (t.keep || [])[0], kind: "labelling", destructive: true,
      what: keep && empty.length ? "Delete copies" : "Resolve duplicates",
      priority: 3,
      why: keep && empty.length
        ? "Uploaded " + t.task_ids.length + " times. Task " + keep + " holds all "
          + t.spans + " labelled strikes; the other " + empty.length
          + " are empty and never exported, so deleting them loses nothing."
        : "Uploaded " + t.task_ids.length + " times and more than one copy has labels — these need "
          + "looking at by hand before anything is deleted.",
      ids: (keep ? ["keep " + keep] : []).concat(empty.length ? ["delete " + empty.join(", ")] : []),
    });
  });

  (DATA.quality.unreviewed_kicks || []).forEach(r => {
    add("kick:" + r.video_id, {
      title: r.video_id, kind: "labelling", what: "Kick review", priority: 3,
      why: "Kicks in this clip have not been through the lead/rear review yet.",
      ids: [r.file, r.spans + " strikes"],
    });
  });

  return out.filter(o => STATE.hidden.indexOf(o.id) < 0);
}

/* Filming and footage-research jobs. Same card and the same shared assignments — they simply belong
   next to the coverage gaps that motivate them rather than in a list of clips. */
function recordingItems() {
  const out = [];
  DATA.queue.forEach((q, i) => {
    if (q.action.indexOf("film") < 0) return;     // re-splits are nobody's to pick up
    const id = "rec:" + q.name;
    out.push(Object.assign({
      id, title: q.name, kind: "recording", what: q.action_label,
      why: q.reason, summary: q.summary || "", assignee: "", status: "todo", due: "",
      priority: i < 2 ? 1 : (i < 5 ? 2 : 3),
      ids: (q.spans !== null ? [q.spans + " examples"] : [])
        .concat(q.units ? [q.units + " sessions"] : []),
    }, STATE.work[id] || {}));
  });
  return out.filter(o => STATE.hidden.indexOf(o.id) < 0);
}

/* Strikes the team has flagged by hand. These head the Priorities tab rather than the board: the
   answer to "film more lead_head_kick" is a gym session, not a clip with a deadline. */
function flaggedStrikes() {
  return Object.keys(STATE.flags).map(name => ({
    name, note: (STATE.flags[name] || {}).note || "",
    cls: DATA.classes.find(c => c.name === name) || null,
  }));
}

function dueClass(due, status) {
  if (!due || status === "done") return "ok";
  const days = Math.round((new Date(due + "T00:00:00") - new Date(DATA.date + "T00:00:00")) / 86400000);
  if (days < 0) return "over";
  if (days <= 2) return "soon";
  return "ok";
}
function dueLabel(due, status) {
  if (!due) return "";
  const days = Math.round((new Date(due + "T00:00:00") - new Date(DATA.date + "T00:00:00")) / 86400000);
  if (status === "done") return "done";
  if (days < 0) return Math.abs(days) + "d overdue";
  if (days === 0) return "due today";
  if (days === 1) return "due tomorrow";
  return "due in " + days + "d";
}

/* ══ persistence ══════════════════════════════════════════════════════════
   The page republishes ITSELF. `publish` needs a complete document, and it must not be the live DOM
   (which carries viewer session state), so the replacement is rebuilt from the three static blocks
   this page was served with — stylesheet, data, and this script — plus the new state. */
let artifactCap = null, capChecked = false;
// Opened as a plain file there is no viewer and no capability to ask, so saving is impossible.
const OFFLINE = typeof window !== "undefined" && !!window.SV_OFFLINE;
let readOnly = OFFLINE;
let saveTimer = null, pending = false;

function buildDoc(state) {
  const css = document.getElementById("app-css").textContent;
  const js = document.getElementById("app-js").textContent;
  const data = document.getElementById("app-data").textContent;
  const j = s => s.replace(/<\//g, "<\\/");
  return '<!doctype html><html><head><meta charset="utf-8">'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">'
    + "<title>Sekuence Label Desk</title>"
    + '<link rel="preconnect" href="https://fonts.googleapis.com">'
    + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
    + '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700'
    + "&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap\">"
    + '<style id="app-css">' + css + "</style></head><body>"
    + '<div id="root"></div>'
    + '<script id="app-data" type="application/json">' + j(data) + "<\/script>"
    + '<script id="app-state" type="application/json">' + j(JSON.stringify(state)) + "<\/script>"
    + '<script id="app-js">' + js + "<\/script></body></html>";
}

function toast(msg, ms) {
  let el = $(".saving");
  if (!el) { el = document.createElement("div"); el.className = "saving"; document.body.appendChild(el); }
  el.textContent = msg;
  clearTimeout(el._t);
  if (ms) el._t = setTimeout(() => el.remove(), ms);
}

async function cap() {
  if (OFFLINE) return null;
  if (capChecked) return artifactCap;
  capChecked = true;
  try { artifactCap = window.claude && window.claude.use ? await window.claude.use("artifact") : null; }
  catch (e) { artifactCap = null; }
  return artifactCap;
}

/* Edits are batched: several clicks in a row become one published version. Publishing reloads every
   open view, so it is the last act of an interaction, never a per-keystroke write. */
function save() {
  pending = true;
  toast("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const a = await cap();
    if (!a) { readOnly = true; toast("Not saved — this view is read-only.", 4000); render(); return; }
    try {
      await a.publish(buildDoc(STATE));
      pending = false;
    } catch (e) {
      const code = e && e.code;
      if (code === "conflict") { toast("Someone else saved first — reloading.", 4000); return; }
      if (code === "not_writer" || code === "not_granted" || code === "consent_required"
          || code === "not_declared" || code === "capability_disabled") {
        readOnly = true; toast("This view is read-only — your change was not saved.", 5000); render();
        return;
      }
      if (code === "rate_limited") { toast("Saving too fast — try again in a moment.", 4000); return; }
      toast("Could not save (" + (code || "error") + ").", 5000);
    }
  }, 900);
}

function setWork(id, patch) {
  STATE.work[id] = Object.assign({}, STATE.work[id] || {}, patch);
  save();
  render();
}
function toggleFlag(name) {
  if (STATE.flags[name]) delete STATE.flags[name];
  else STATE.flags[name] = { at: DATA.date };
  save();
  render();
}

/* ══ home ═════════════════════════════════════════════════════════════════
   The whole project on one screen: are we hitting the week, what is on the board, what to do next,
   what is most at risk. Home also absorbed the old Priorities and People tabs — the ranked list is
   one line per item now, so it fits, and a separate tab for it was a click nobody needed. */
function viewHome() {
  const items = workItems();
  const open = items.filter(i => (i.status || "todo") !== "done");
  const overdue = open.filter(i => i.due && dueClass(i.due, i.status) === "over");
  const unassigned = open.filter(i => !i.assignee);
  const goal = DATA.people.rows.filter(p => p.weekly_target > 0);
  const done = goal.reduce((a, p) => a + p.since, 0);
  const target = goal.reduce((a, p) => a + p.weekly_target, 0);
  const share = target ? Math.min(100, 100 * done / target) : 0;
  const starving = DATA.classes.filter(r => r.starves);
  const flagged = flaggedStrikes();
  const rec = recordingItems().filter(i => (i.status || "todo") !== "done");
  const c = DATA.coverage;
  const gaps = [["Camera angle", c.camera.square_on, c.camera.target],
                ["Southpaw", c.stance.southpaw, c.stance.target],
                ["Idle footage", c.idle.clips, c.idle.target]].filter(g => g[1] < g[2]);

  return `
  <div class="panel">
    <h2>This week</h2>
    <div class="herobig">${num(done)}<span class="of"> of ${num(target)} strikes</span></div>
    <div class="meter" style="height:10px;margin-top:10px;max-width:520px"><i class="${share >= 100 ? "done" : (share < 50 ? "low" : "")}" style="width:${share.toFixed(1)}%"></i></div>
    <p class="sub" style="margin:9px 0 0">${done >= target ? "Goal beaten."
      : num(target - done) + " to go · " + Math.round(share) + "% there"}</p>
    <div class="grid" style="margin-top:16px">
      ${goal.map(p => {
        const mine = open.filter(i => i.assignee === p.username).length;
        return `<div class="tile">
          <h3>${esc(p.display)}</h3>
          <div class="big">${num(p.since)}<span class="of"> strikes</span></div>
          <p>${mine ? mine + " clip" + (mine === 1 ? "" : "s") + " assigned" : "Nothing assigned"}</p>
        </div>`; }).join("")}
    </div>

  </div>

  <div class="panel">
    <h2>Jobs</h2>
    <div class="strip" style="padding:0 0 10px">
      <div class="stat"><b>${open.length}</b><small>clips to label</small></div>
      <div class="stat"><b>${rec.length}</b><small>to record</small></div>
      <div class="stat ${overdue.length ? "alarm" : ""}"><b>${overdue.length}</b><small>overdue</small></div>
      <div class="stat ${unassigned.length ? "alarm" : ""}"><b>${unassigned.length}</b><small>unassigned</small></div>
    </div>
    ${overdue.length ? `<ul class="plain">${overdue.slice(0, 4).map(i =>
      `<li><strong>${esc(dueLabel(i.due, i.status))}</strong> — ${esc(i.title)} · ${esc(i.assignee ? displayName(i.assignee) : "nobody")}</li>`).join("")}</ul>` : ""}
    <p class="sub" style="margin-top:10px"><a href="#work" data-goto="work">Clips →</a>
      &nbsp;·&nbsp; <a href="#footage" data-goto="footage">Recording →</a></p>
  </div>

  ${flagged.length ? `<div class="panel">
    <h2>Flagged by the team</h2>
    <ul class="plain">${flagged.map(f => `<li><strong>${esc(f.name)}</strong>
      <span class="dim">— ${esc(f.note || (f.cls ? f.cls.spans + " examples, " + f.cls.units + " sessions" : "flagged"))}</span>
      <button class="chip flat" data-flag="${esc(f.name)}" style="cursor:pointer;border:0;margin-left:6px">remove</button></li>`).join("")}</ul>
  </div>` : ""}

  <div class="panel">
    <h2>Do these next</h2>
    <ol class="plain">${DATA.queue.map(q =>
      `<li><span class="chip ${q.action.indexOf("film") >= 0 ? "film" : (q.action === "resplit" ? "resplit" : "label")}">${esc(q.action_label)}</span>
        <strong>${esc(q.name)}</strong>
        <span class="dim">— ${esc(q.summary || q.reason.split(";")[0])}</span></li>`).join("")}</ol>
  </div>

  <div class="panel">
    <h2>Biggest risks</h2>
    <div class="grid">
      <div class="tile"><h3>Strikes at risk</h3>
        <div class="big">${starving.length}</div>
        <p>${starving.length ? esc(starving.slice(0, 3).map(r => r.name).join(", "))
            + (starving.length > 3 ? " +" + (starving.length - 3) : "") : "None."}
          <a href="#strikes" data-goto="strikes">Strikes →</a></p></div>
      ${gaps.map(([label, have, want]) => `<div class="tile"><h3>${esc(label)}</h3>
        <div class="big">${have}<span class="of"> / ${want}</span></div>
        <p>Only filming moves this. <a href="#footage" data-goto="footage">Footage →</a></p></div>`).join("")}
    </div>
  </div>`;
}

function displayName(u) {
  const p = DATA.people.rows.find(r => r.username === u);
  return p ? p.display : u;
}

/* ══ tabs ═════════════════════════════════════════════════════════════════ */
const TABS = [
  ["home", "Home"], ["work", "Work"], ["strikes", "Strikes"],
  ["model", "Model"], ["footage", "Footage"],
];
let tab = "home";
let filters = { cls: "", problems: false, board: "open", who: "", kind: "" };

function setTab(t) {
  tab = t;
  try { localStorage.setItem("sv-tab", t); history.replaceState(null, "", "#" + t); } catch (e) {}
  render();
}

/* ══ views ═══════════════════════════════════════════════════════════════
   Five tabs, each with one job. The Model tab is the model for all of them: a VERDICT per row, not a
   table to interpret. Wherever a table survives it is because the numbers are the point — and even
   then every row ends in a plain-language state chip. */
function viewWork() {
  const items = workItems();
  const open = items.filter(i => (i.status || "todo") !== "done");
  const mine = filters.who ? items.filter(i => i.assignee === filters.who) : items;
  let shown = filters.board === "open" ? mine.filter(i => (i.status || "todo") !== "done")
            : filters.board === "done" ? mine.filter(i => i.status === "done")
            : mine;
  shown = shown.slice().sort((a, b) => {
    const ad = a.due || "9999", bd = b.due || "9999";
    return (a.priority - b.priority) || ad.localeCompare(bd) || a.title.localeCompare(b.title);
  });
  const overdue = open.filter(i => i.due && dueClass(i.due, i.status) === "over").length;
  const unassigned = open.filter(i => !i.assignee).length;
  const people = DATA.people.rows;

  return `
  <div class="panel">
    <h2>Clips to label</h2>
    <p class="sub">Shared — set an owner and everyone sees it.
      Filming jobs are on <a href="#footage" data-goto="footage">Footage</a>.</p>
    ${readOnly ? '<div class="readonly-banner">' + (OFFLINE
      ? "Offline copy from " + esc(DATA.generated_at.slice(0, 10)) + ". Everything is here to read, "
        + "but ticking things off will not save — ask Imran to update the board."
      : "Read-only view — changes will not save.") + '</div>' : ""}
    <div class="strip" style="padding:0 0 14px">
      <div class="stat"><b>${open.length}</b><small>open</small></div>
      <div class="stat ${overdue ? "alarm" : ""}"><b>${overdue}</b><small>overdue</small></div>
      <div class="stat ${unassigned ? "alarm" : ""}"><b>${unassigned}</b><small>unassigned</small></div>
      <div class="stat"><b>${items.length - open.length}</b><small>done</small></div>
    </div>
    <div class="board-toolbar">
      <div class="seg">
        ${[["open", "Open"], ["all", "All"], ["done", "Done"]].map(([k, l]) =>
          `<button data-board="${k}" aria-pressed="${filters.board === k}">${l}</button>`).join("")}
      </div>
      <select id="who-filter" class="pick">
        <option value="">Everyone</option>
        ${people.map(p => `<option value="${esc(p.username)}" ${filters.who === p.username ? "selected" : ""}>${esc(p.display)}</option>`).join("")}
      </select>
    </div>
    <div class="work">
      ${shown.length ? shown.map(i => itemCard(i, people)).join("")
        : '<p class="sub">Nothing here.</p>'}
    </div>
  </div>`;
}

function itemCard(i, people) {
  const status = i.status || "todo";
  const KIND = { recording: "Record", labelling: "Label" };
  return `
  <div class="item ${i.destructive ? "danger" : ""} ${status === "done" ? "done" : ""}">
    <div class="sev"></div>
    <div class="body">
      <div class="title">
        <span class="dot ${status}"></span>
        ${i.task ? `<span class="taskid" title="CVAT task">#${esc(i.task)}</span>` : ""}
        <b>${esc(i.title)}</b>
        <span class="chip ${i.destructive ? "film" : "label"}">${esc(i.what || KIND[i.kind] || "Task")}</span>
        ${i.due ? `<span class="due ${dueClass(i.due, status)}">${esc(dueLabel(i.due, status))}</span>` : ""}
      </div>
      <div class="why">${esc(i.summary || i.why)}</div>
      ${i.ids.length ? `<div class="ids">${i.ids.map(x => `<code>${esc(x)}</code>`).join("")}</div>` : ""}
    </div>
    <div class="ctl">
      <label>Owner</label>
      <select data-item="${esc(i.id)}" data-field="assignee" ${readOnly ? "disabled" : ""}>
        <option value="">Nobody</option>
        ${people.map(p => `<option value="${esc(p.username)}" ${i.assignee === p.username ? "selected" : ""}>${esc(p.display)}</option>`).join("")}
      </select>
      <label>Due</label>
      <input type="date" data-item="${esc(i.id)}" data-field="due" value="${esc(i.due || "")}" ${readOnly ? "disabled" : ""}>
      <label>Status</label>
      <select data-item="${esc(i.id)}" data-field="status" ${readOnly ? "disabled" : ""}>
        ${STATUSES.map(([k, l]) => `<option value="${k}" ${status === k ? "selected" : ""}>${l}</option>`).join("")}
      </select>
    </div>
  </div>`;
}

/* Strikes = the old Classes and Split-health tabs. They were always the same subject seen twice:
   how much of a strike exists, and whether enough of it survives the practice/test split. One row
   per strike, ending in a verdict. */
function viewStrikes() {
  const q = filters.cls.toLowerCase();
  const roster = DATA.split["BAG_VAL_SUBJECTS"] || DATA.split[Object.keys(DATA.split)[0]];
  const split = {};
  (roster.classes || []).forEach(c => { split[c.name] = c; });
  const rows = DATA.classes
    .filter(r => !q || r.name.indexOf(q) >= 0)
    .filter(r => !filters.problems || r.starves || r.below_learnable || STATE.flags[r.name]);
  const cut = new Set(DATA.exclude_classes || []);
  const verdict = r => {
    if (cut.has(r.name)) return ["flat", "Not in MVP"];
    if (r.below_learnable) return ["film", "Too few"];
    if (r.starves) return ["film", "At risk"];
    const c = split[r.name];
    if (c && c.no_val && c.total >= 100) return ["resplit", "Never tested"];
    return ["ok", "Healthy"];
  };
  return `
  <div class="panel">
    <h2>Strikes</h2>
    <p class="sub">Bar = examples per filming session, biggest highlighted. ⚑ to flag.</p>
    <div class="toolbar">
      <input type="search" id="class-filter" placeholder="Filter…" value="${esc(filters.cls)}" aria-label="Filter strikes">
      <label><input type="checkbox" id="class-problems" ${filters.problems ? "checked" : ""}> Problems only</label>
    </div>
    <div class="tablewrap"><table>
      <thead><tr><th style="width:26px"></th><th>Strike</th><th class="num">Examples</th>
        <th>Across sessions</th><th class="num">Effective</th>
        <th class="num">Practice</th><th class="num">Test</th><th>State</th></tr></thead>
      <tbody>${rows.map(r => {
        const [cls, label] = verdict(r);
        const c = split[r.name] || {};
        const tot = r.spans || 1;
        return `<tr class="${cls !== "ok" ? "bad" : ""}">
          <td><button class="flagbtn" data-flag="${esc(r.name)}" aria-pressed="${!!STATE.flags[r.name]}"
              title="Flag">⚑</button></td>
          <td class="name">${esc(r.name)}</td>
          <td class="num">${r.spans}</td>
          <td><div class="bar" style="min-width:120px">${r.units_top.map(([u, n], i) =>
            `<i class="${i === 0 ? "lead" : ""}" style="width:${(100 * n / tot).toFixed(1)}%" title="${esc(u)}: ${n}"></i>`).join("")}</div></td>
          <td class="num">${r.eff_units}</td>
          <td class="num dim">${c.train === undefined ? "—" : c.train}</td>
          <td class="num dim">${c.val === undefined ? "—" : c.val}</td>
          <td><span class="chip ${cls}">${label}</span></td>
        </tr>`; }).join("")}</tbody></table></div>
    <p class="note"><strong>Effective</strong> = sessions it behaves like, not sessions counted.
      <strong>At risk</strong> = hold back its biggest session for testing and too little is left to
      learn from. Split shown for the next training run.</p>
  </div>
  <div class="panel">
    <h2>Lead and rear pairs</h2>
    <p class="sub">One-sided data teaches "low kick = rear".</p>
    <div class="tablewrap"><table>
      <thead><tr><th>Pair</th><th class="num">Lead</th><th class="num">Rear</th><th class="num">Ratio</th><th>State</th></tr></thead>
      <tbody>${DATA.sided.map(s => `<tr class="${s.one_sided ? "bad" : ""}">
        <td class="name">${esc(s.lead)} / ${esc(s.rear)}</td>
        <td class="num">${s.lead_spans}</td><td class="num">${s.rear_spans}</td>
        <td class="num">${s.ratio}×</td>
        <td>${s.one_sided ? `<span class="chip film">Needs ${esc(s.weak_side.split("_")[0])}</span>`
                          : '<span class="chip ok">Balanced</span>'}</td></tr>`).join("")}</tbody></table></div>
  </div>`;
}

function plainDiagnosis(c) {
  if (c.action === "re-split") return {
    head: `${c.gt} gets called “${c.pred}”`,
    plain: `Spotted ${pct(c.recall)} of the time — found, just named wrong. Almost every ${c.pred} `
      + `example sits on the practice side, so it is never tested on them. Bookkeeping, not footage.`,
    todo: "Nothing to film or label — Imran re-splits the data.",
    nobody: true,
  };
  if (c.action === "film") return {
    head: `${c.gt} confused with ${c.pred}`,
    plain: `Only ${num(c.train)} examples to learn from, so it falls back on the strike it has seen more of.`,
    todo: `Film and label more ${c.gt}.`,
    nobody: false,
  };
  return {
    head: `${c.gt} and ${c.pred} look alike`,
    plain: `${num(c.train)} examples, so not a shortage — these two are genuinely hard to tell apart `
      + `from this angle.`,
    todo: "Spot-check a few labels.",
    nobody: false,
  };
}

function viewModel() {
  const e = DATA.errors;
  if (!e.available) return `<div class="panel"><h2>Model</h2><p class="sub">${esc(e.note)}</p></div>`;
  const h = e.headline || {};
  return `
  <div class="panel">
    <h2>How the model is doing</h2>
    <p class="sub">On clips it never trained on.</p>
    <div class="grid">
      <div class="tile"><h3>Strikes it found</h3><div class="big">${pct(h.recall)}</div>
        <p>Of strikes thrown, how many it spotted.</p></div>
      <div class="tile"><h3>Calls that were real</h3><div class="big">${pct(h.precision)}</div>
        <p>When it calls a strike, how often one was there.</p></div>
      <div class="tile"><h3>Named exactly right</h3><div class="big">${pct(h.joined_acc)}</div>
        <p>Of those found, how many named right.</p></div>
      <div class="tile"><h3>Tested on</h3><div class="big">${e.n_clips}<span class="of"> clips</span></div>
        <p>Out of ${DATA.totals.clips}.</p></div>
    </div>
  </div>
  <div class="panel">
    <h2>What it gets wrong</h2>
    ${e.confusions.map(c => {
      const d = plainDiagnosis(c);
      return `<div class="diag">
        <h4>${esc(d.head)}</h4>
        <div class="plain">${esc(d.plain)}</div>
        <div class="todo ${d.nobody ? "nobody" : ""}">${d.nobody ? "→ " : "✔ "}${esc(d.todo)}</div>
        <div class="nums">${c.n}× · ${num(c.train)} practice · ${num(c.val)} test</div>
      </div>`; }).join("")}
    ${(e.no_val_support || []).length ? `<p class="note crit"><strong>Never tested:</strong>
      ${e.no_val_support.map(n => `<code>${esc(n)}</code>`).join(" · ")} — all examples went to
      practice, none kept for testing. A splitting fix, not a filming one.</p>` : ""}
  </div>`;
}

/* Footage = the old Pipeline, Coverage and Quality tabs. All three answer "what footage do we have,
   what is wrong with it, and what is missing" — and the per-clip camera table that used to live here
   was 75 rows nobody could act on, so it is a distribution now. */
function viewFootage() {
  const p = DATA.pipeline, c = DATA.coverage, q = DATA.quality;
  const rec = recordingItems();
  const recOpen = rec.filter(i => (i.status || "todo") !== "done");
  const people = DATA.people.rows;
  const hk = c.head_kick || {};
  const gaps = [["Camera facing the athlete", c.camera.square_on, c.camera.target,
                 `All ${c.camera.measured} clips are side-on — a hook and a straight look the same from there.`],
                ["Head kicks", hk.spans || 0, hk.target || 0,
                 `${hk.rear || 0} rear to ${hk.lead || 0} lead. The thinnest strike family, and the hardest to film.`],
                ["Southpaw stance", c.stance.southpaw, c.stance.target,
                 `${c.stance.orthodox} orthodox vs ${c.stance.southpaw} southpaw. Always guessing "orthodox" would score the same.`],
                ["Footage with no strikes", c.idle.clips, c.idle.target,
                 "Warmups with nothing thrown. The only way to catch invented strikes."]];
  const checks = [
    ["Missing pose files", q.no_pose.length, q.no_pose.length
      ? q.no_pose.map(r => r.file).join(", ") : "None."],
    ["Unfinished strikes", q.unclosed.length, q.unclosed.length
      ? q.unclosed.map(u => u.file).join(", ") : "None."],
    ["Uploaded to CVAT twice", (q.duplicate_tasks || []).length, (q.duplicate_tasks || []).length
      ? "Labels split across copies — on the work board to merge." : "None."],
  ];
  return `
  <div class="panel">
    <h2>To record</h2>
    <p class="sub">${recOpen.length} open. Give each an owner and a date like any other job.</p>
    ${readOnly ? '<div class="readonly-banner">' + (OFFLINE
      ? "Offline copy from " + esc(DATA.generated_at.slice(0, 10)) + ". Everything is here to read, "
        + "but ticking things off will not save — ask Imran to update the board."
      : "Read-only view — changes will not save.") + '</div>' : ""}
    <div class="work">${rec.map(i => itemCard(i, people)).join("")}</div>
  </div>
  <div class="panel">
    <h2>What is missing</h2>
    <p class="sub">Only filming moves these.</p>
    <div class="grid">
      ${gaps.map(([label, have, want, why]) => `<div class="tile">
        <h3>${esc(label)}</h3>
        <div class="big ${have < want ? "" : ""}">${have}<span class="of"> / ${want}</span></div>
        <p>${esc(why)}</p></div>`).join("")}
    </div>
  </div>
  <div class="panel">
    <h2>Where every clip is</h2>
    <p class="sub">Unchecked steps say <em>unknown</em>, never guessed.</p>
    ${!p.cvat_available ? `<p class="note crit">CVAT unreachable — task columns unknown.</p>` : ""}
    ${!p.drive_configured ? '<p class="note warn">Drive not connected — “downloaded” cannot be checked.</p>' : ""}
    <div class="kan" style="margin-top:12px">
      ${p.stages.map(st => `<div class="col"><h3>${esc(p.stage_labels[st])}</h3>
        <div class="big">${p.stage_counts[st]}<span class="of" style="font-size:14px;color:var(--muted)"> / ${p.n_clips}</span></div>
        ${p.stage_unknown[st] ? `<div class="unk">${p.stage_unknown[st]} unknown</div>` : ""}</div>`).join("")}
    </div>
    ${p.stuck.length ? `<p class="note warn">${p.stuck.length} clip(s) untouched for
      ${p.stuck_days}+ days: ${p.stuck.slice(0, 5).map(r => `<code>${esc(r.file)}</code>`).join(" ")}</p>` : ""}
  </div>
  <div class="panel">
    <h2>Checks</h2>
    <div class="grid">
      ${checks.map(([label, n, detail]) => `<div class="tile">
        <h3>${esc(label)}</h3><div class="big">${n}</div><p>${esc(detail)}</p></div>`).join("")}
    </div>
  </div>
`;
}

/* ══ render ═══════════════════════════════════════════════════════════════ */
const VIEWS = { home: viewHome, work: viewWork, strikes: viewStrikes,
                model: viewModel, footage: viewFootage };

function render() {
  const items = workItems();
  const openN = items.filter(i => (i.status || "todo") !== "done").length;
  const starving = DATA.classes.filter(r => r.starves).length;
  const counts = { work: openN, strikes: DATA.classes.length };

  $("#root").innerHTML = `
  <header><div class="wrap">
    <div class="masthead">
      <div class="mark">Seku<span>ence</span> Label Desk</div>
      <div class="stamp">data from ${esc(DATA.generated_at)}</div>
    </div>
    <div class="strip">
      <div class="stat"><b>${openN}</b><small>jobs open</small></div>
      <div class="stat"><b>${num(DATA.totals.spans)}</b><small>strikes labelled</small></div>
      <div class="stat"><b>${DATA.totals.clips}</b><small>clips</small></div>
      <div class="stat"><b>${DATA.totals.classes}</b><small>strike types</small></div>
      <div class="stat ${starving ? "alarm" : ""}"><b>${starving}</b><small>at risk</small></div>
    </div>
    <nav role="tablist">${TABS.map(([k, l]) =>
      `<button role="tab" data-tab="${k}" aria-selected="${tab === k}">${l}${counts[k] !== undefined ? `<span class="n">${counts[k]}</span>` : ""}</button>`).join("")}</nav>
  </div></header>
  <main class="wrap">${VIEWS[tab]()}</main>
  <footer class="wrap">${DATA.totals.clips} exports · ${DATA.totals.cvat_tasks} live CVAT tasks ·
    measured ${esc(DATA.generated_at)}. Assignments save into this page for everyone. Read-only
    against CVAT.</footer>`;
  wire();
}

function wire() {
  document.querySelectorAll("nav button").forEach(b =>
    b.onclick = () => setTab(b.dataset.tab));
  document.querySelectorAll("[data-board]").forEach(b =>
    b.onclick = () => { filters.board = b.dataset.board; render(); });
  const who = $("#who-filter");
  if (who) who.onchange = () => { filters.who = who.value; render(); };
  const kind = $("#kind-filter");
  if (kind) kind.onchange = () => { filters.kind = kind.value; render(); };
  document.querySelectorAll("[data-item]").forEach(el =>
    el.onchange = () => setWork(el.dataset.item, { [el.dataset.field]: el.value }));
  document.querySelectorAll("[data-flag]").forEach(b =>
    b.onclick = () => toggleFlag(b.dataset.flag));
  document.querySelectorAll("[data-goto]").forEach(a =>
    a.onclick = e => { e.preventDefault(); setTab(a.dataset.goto); });
  const cf = $("#class-filter");
  if (cf) {
    cf.oninput = () => { filters.cls = cf.value; render(); $("#class-filter").focus(); };
  }
  const cp = $("#class-problems");
  if (cp) cp.onchange = () => { filters.problems = cp.checked; render(); };
}

let start = location.hash.slice(1);
if (!TABS.some(t => t[0] === start)) {
  try { start = localStorage.getItem("sv-tab") || "home"; } catch (e) { start = "home"; }
}
tab = TABS.some(t => t[0] === start) ? start : "home";
render();
/* Resolve the capability early so a read-only view can grey its controls before anyone clicks. */
cap().then(a => { if (!a) { readOnly = true; render(); } });

</script>
</body></html>
